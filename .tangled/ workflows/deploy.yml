when:
  - event: ["push", "manual"]
    branch: ["main"]

engine: microvm
image: nixos

dependencies:
  - nodejs

environment:
  # Set CLOUDFLARE_API_TOKEN as a CI secret with permission to deploy this worker.
  CLOUDFLARE_ACCOUNT_ID: ""

steps:
  - name: deploy
    command: |
      cd api
      npm ci
      npx wrangler deploy
